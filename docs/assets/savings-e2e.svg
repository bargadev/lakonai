<svg xmlns="http://www.w3.org/2000/svg" width="820" height="458" viewBox="0 0 820 458" role="img" aria-labelledby="t d">
<title id="t">lakonai: tokens saved per command</title>
<desc id="d">End-to-end run of real commands on a fixture git repository, raw output versus lakonai output. Overall 86.3% smaller (33,800 → 4,635 tokens).</desc>
<style>
  :root { --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --ink-3: #8a8983; --grid: #e6e5e0; --series-1: #2a78d6; }
  @media (prefers-color-scheme: dark) {
    :root { --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --ink-3: #8f8e86; --grid: #2e2e2c; --series-1: #3987e5; }
  }
  text { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
  .bg { fill: var(--surface); }
  .h1 { font-size: 17px; font-weight: 600; }
  .sub { font-size: 12.5px; fill: var(--ink-2); }
  .label { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; fill: var(--ink); }
  .value { font-size: 12.5px; font-weight: 600; fill: var(--ink); }
  .muted { font-weight: 400; fill: var(--ink-2); }
  .axis { font-size: 11px; fill: var(--ink-3); }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .bar { fill: var(--series-1); }
</style>
<rect class="bg" width="820" height="458" rx="8"/>
<text class="h1" x="24" y="32">Tokens saved per command: 86.3% overall</text>
<text class="sub" x="24" y="52">Real CLI runs on a fixture repo (61 files, 31 commits) · raw → lakonai tokens (≈4 chars/token) · v1.4.1</text>
<line class="grid" x1="250" x2="250" y1="70" y2="412"/><text class="axis" x="250" y="430" text-anchor="middle">0%</text><line class="grid" x1="335" x2="335" y1="70" y2="412"/><text class="axis" x="335" y="430" text-anchor="middle">25%</text><line class="grid" x1="420" x2="420" y1="70" y2="412"/><text class="axis" x="420" y="430" text-anchor="middle">50%</text><line class="grid" x1="505" x2="505" y1="70" y2="412"/><text class="axis" x="505" y="430" text-anchor="middle">75%</text><line class="grid" x1="590" x2="590" y1="70" y2="412"/><text class="axis" x="590" y="430" text-anchor="middle">100%</text>
