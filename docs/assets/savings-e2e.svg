<text class="label" x="236" y="261.5" text-anchor="end">ls -la src/api</text><path class="bar" d="M250,248H518Q522,248 522,252V262Q522,266 518,266H250Z"/><text class="value" x="530" y="261.5">80%<tspan class="muted" dx="8">180 → 36</tspan></text></g><g><title>git status: 177 → 113 tokens (36.2% smaller)</title><text class="label" x="236" y="295.5" text-anchor="end">git status</text><path class="bar" d="M250,282H369.08000000000004Q373.08000000000004,282 373.08000000000004,286V296Q373.08000000000004,300 369.08000000000004,300H250Z"/><text class="value" x="381.08000000000004" y="295.5">36.2%<tspan class="muted" dx="8">177 → 113</tspan></text></g><g><title>find . -type f: 419 → 287 tokens (31.5% smaller)</title><text class="label" x="236" y="329.5" text-anchor="end">find . -type f</text><path class="bar" d="M250,316H353.1Q357.1,316 357.1,320V330Q357.1,334 353.1,334H250Z"/><text class="value" x="365.1" y="329.5">31.5%<tspan class="muted" dx="8">419 → 287</tspan></text></g><g><title>make: 969 → 824 tokens (15% smaller)</title><text class="label" x="236" y="363.5" text-anchor="end">make</text><path class="bar" d="M250,350H297Q301,350 301,354V364Q301,368 297,368H250Z"/><text class="value" x="309" y="363.5">15%<tspan class="muted" dx="8">969 → 824</tspan></text></g><g><title>sed -n '1,60p' file: 300 → 300 tokens (0% smaller)</title><text class="label" x="236" y="397.5" text-anchor="end">sed -n '1,60p' file</text><text class="value" x="258" y="397.5">0%<tspan class="muted" dx="8">300 → 300</tspan></text></g>
</svg>
